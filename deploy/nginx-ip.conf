server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 193.112.151.236;
    location ^~ /.well-known/acme-challenge/ { root /var/www/tfs4; }
    location / { return 308 https://193.112.151.236$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 193.112.151.236;
    ssl_certificate /etc/letsencrypt/live/193.112.151.236/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/193.112.151.236/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    location = /media/2025-listening.mp3 {
        alias /var/lib/ruanshizi/media/2025-listening.mp3;
        default_type audio/mpeg;
    }
    location / {
        proxy_pass http://127.0.0.1:4174;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 30s;
    }
}
