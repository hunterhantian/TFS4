<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#121825"><title>2025 法语专四 · 模考</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="shell">
    <header class="topbar"><a class="brand" href="#" aria-label="返回首页"><span>F4</span><b>2025 法语专四</b></a><div class="timer" aria-label="考试计时"><i></i><strong id="clock">00:00:00</strong></div></header>
    <section id="welcome" class="welcome">
      <p class="kicker">TFS4 · 选择题模考</p><h1>把注意力，留给这一题。</h1>
      <p>100 道选择题 · 深色专注界面 · 每题记录答案、信心和答题时间。</p>
      <div class="notice"><span>⚑</span><div><b>工作答案键</b><br>第 55、62、100 题在提交结果中会标记为「待复核」。</div></div>
      <button id="start" class="primary">开始本次考试 <span>→</span></button>
      <button id="open-history" class="text-button">查看本机存档</button>
    </section>
    <section id="exam" hidden>
      <div class="progress-row"><div><p class="kicker" id="group-name"></p><h2 id="page-title"></h2></div><div class="progress"><b id="answered-count">0</b><span>/ 100 已答</span></div></div>
      <div id="page-dots" class="page-dots" aria-label="分页导航"></div>
      <div id="questions" class="questions"></div>
      <nav class="pager"><button id="prev" class="secondary">← 上一组</button><button id="next" class="primary">下一组 →</button></nav>
      <button id="submit" class="submit">交卷并存档</button>
    </section>
    <section id="history" hidden class="history"><div class="view-title"><div><p class="kicker">ARCHIVE</p><h1>考试存档</h1></div><button class="secondary back">返回考试</button></div><div id="history-list"></div></section>
  </main>
  <dialog id="result"><div id="result-content"></div><button id="result-close" class="primary">完成</button></dialog>
  <script src="exam-data.js"></script><script src="app.js"></script>
</body></html>
