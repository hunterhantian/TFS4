<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#121825"><title>2025 法语专四 · 模考</title>
  <link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="reading.css"><link rel="stylesheet" href="archive.css"><link rel="stylesheet" href="brand.css"><link rel="stylesheet" href="report-confidence.css">
</head>
<body>
  <main class="shell">
    <header class="topbar"><a class="brand" href="#" aria-label="返回首页"><img class="brand-logo" src="ruanshizi-logo-cutout.png" alt="软柿子 logo"><span class="brand-copy"><b>软柿子</b><small>2025 法语专四</small></span></a><div class="timer" aria-label="考试计时"><i></i><strong id="clock">00:00:00</strong></div></header>
    <section id="welcome" class="welcome">
      <p class="kicker">TFS4 · 选择题模考</p><h1>软柿子</h1>
      <p class="welcome-subtitle">专注法语专四考试</p>
      <p>100 道选择题 · 自动保存进度 · 每题记录答案、信心和答题时间。</p>
      <div class="notice"><span>⚑</span><div><b>官方参考答案</b><br>本次按已确认的参考答案评分。</div></div>
      <button id="start" class="primary">开始本次考试 <span>→</span></button>
      <button id="open-history" class="text-button">查看本机存档</button>
    </section>
    <section id="exam" hidden>
      <div class="progress-row"><div><p class="kicker" id="group-name"></p><h2 id="page-title"></h2></div><div class="progress"><b id="answered-count">0</b><span>/ 100 已答</span></div></div>
      <div id="page-dots" class="page-dots" aria-label="分页导航"></div>
      <section id="listening-player" hidden aria-label="听力音频"><p>2025年听力原声（完整录音，含听写与考试指令；选择题从第1题对应位置开始）</p><audio id="listening-audio" controls preload="metadata" src="/media/2025-listening.mp3"></audio><p id="audio-status" role="status">可暂停、重播和拖动进度；切到非听力题组或离开页面时暂停。</p></section>
      <button id="pause-exam" class="secondary">暂停并保存</button>
      <div id="questions" class="questions"></div>
      <nav class="pager"><button id="prev" class="secondary">← 上一组</button><button id="next" class="primary">下一组 →</button></nav>
      <button id="submit" class="submit">交卷并存档</button>
    </section>
    <section id="history" hidden class="history"><div class="view-title"><div><p class="kicker">ARCHIVE</p><h1>考试存档</h1></div><button class="secondary back">返回考试</button></div><div id="history-list"></div></section>
    <section id="archive-detail" hidden class="history"><div class="view-title"><div><p class="kicker">ARCHIVE REPORT</p><h1>本次考试报告</h1></div><button id="archive-back" class="secondary">返回存档</button></div><div id="archive-content"></div></section>
  </main>
  <dialog id="result"><div id="result-content"></div><button id="result-close" class="primary">完成</button></dialog>
  <script src="exam-data.js"></script><script src="app.js"></script>
</body></html>
