<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>软柿子 · 阶段1体验</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="reading.css"><link rel="stylesheet" href="archive.css"><link rel="stylesheet" href="brand.css"><link rel="stylesheet" href="report-confidence.css"><link rel="stylesheet" href="stage1.css"><link rel="stylesheet" href="bank.css"></head>
<body><main class="shell"><header class="topbar"><button id="brand-home" class="brand text-button"><img class="brand-logo" src="ruanshizi-logo-cutout.png" alt="软柿子"><span class="brand-copy"><b>软柿子</b><small>专注法语专四考试</small></span></button><div><span id="account-name"></span><button id="logout" class="text-button" hidden>退出</button></div></header>
<p id="message" role="status" aria-live="polite"></p>
<section id="login-view" hidden><h1>登录软柿子</h1><p>账号由管理员创建。普通账号只能查看自己的考试记录。</p><form id="login-form"><label>用户名<input name="username" autocomplete="username" required maxlength="64"></label><label>密码<input name="password" type="password" autocomplete="current-password" required maxlength="256"></label><button class="primary" type="submit">登录</button></form></section>
<section id="home-view" hidden><p class="kicker">可靠保存 · 阶段1体验</p><h1>开始或继续考试</h1><p>100道客观题 · 官方参考答案 · 支持暂停续答</p><div id="source-list"></div><h2>未完成考试</h2><div id="attempt-list"></div><h2>本机待同步草稿</h2><div id="draft-list"></div><nav class="home-nav"><button id="open-reports" class="secondary">我的考试记录</button><button id="open-all-reports" class="secondary" hidden>所有考生存档</button><button id="open-import" class="secondary">导入旧本机存档</button><button id="open-admin" class="secondary" hidden>账号管理</button></nav></section>
<section id="exam-view" hidden><div class="progress-row"><div><p id="group-name" class="kicker"></p><h2 id="page-title"></h2></div><div><b id="answered-count">0</b> / <span id="total-count">100</span><p id="clock">00:00:00</p></div></div><p id="sync-status" role="status" aria-live="polite"></p><div id="conflict" hidden><p id="conflict-message"></p><button id="reauth" class="secondary" hidden>重新登录</button><button id="retry-sync" class="secondary">重试同步</button><button id="takeover" class="secondary">确认接管本次考试</button><button id="use-cloud" class="secondary">导出本地待同步内容并读取云端</button></div><div id="page-dots" class="page-dots"></div><section id="listening-player" hidden><p>2025听力完整录音（含听写与考试指令）</p><audio id="listening-audio" controls preload="none" src="/media/2025-listening.mp3"></audio><p id="audio-status">可暂停、重播及拖动进度；暂停考试或离开听力题组时暂停音频。</p></section><button id="pause-exam" class="secondary">暂停并保存</button><div id="questions"></div><nav class="pager"><button id="prev" class="secondary">← 上一组</button><button id="next" class="primary">下一组 →</button></nav><button id="submit" class="submit">交卷并存档</button></section>
<section id="reports-view" hidden><div class="view-title"><h1 id="report-list-title">我的考试记录</h1><button data-home class="secondary">返回首页</button></div><form id="report-filters" class="report-filters"><label>存档时间<select id="archive-range"><option value="last7">最近一周</option><option value="last_week">上周</option><option value="last30">最近30天</option><option value="all" selected>全部时间</option><option value="custom">自定义时间</option></select></label><label id="report-user-filter" hidden>考生<select id="archive-owner"><option value="">全部考生</option></select></label><div id="custom-report-range" hidden><label>开始日期<input type="date" id="archive-from"></label><label>结束日期<input type="date" id="archive-to"></label><button class="secondary" type="submit">应用</button></div></form><p id="archive-range-hint" class="muted"></p><div id="report-list"></div></section>
<section id="report-view" hidden><div class="view-title"><h1>考试报告</h1><button id="report-back" class="secondary">返回记录</button></div><h2 id="report-title" class="archive-title"></h2><p id="report-owner" class="muted" hidden></p><div id="report-content"></div></section>
<section id="import-view" hidden><div class="view-title"><h1>导入旧本机存档</h1><button data-home class="secondary">返回首页</button></div><p>选择从旧原型导出的JSON文件。先备份原文并预览，再由你确认导入；不会覆盖已有记录。</p><label>存档文件<input id="legacy-file" type="file" accept="application/json,.json"></label><div id="import-preview"></div><label id="import-ack-label" hidden><input type="checkbox" id="import-ack">已阅读数据缺失及旧答案口径说明</label><button id="confirm-import" class="primary" hidden>确认导入所选记录</button></section>
<section id="admin-view" hidden><div class="view-title"><h1>账号管理</h1><button data-home class="secondary">返回首页</button></div><form id="create-user-form"><h2>创建账号</h2><label>用户名<input name="username" required minlength="3" maxlength="64" autocomplete="off"></label><label>初始密码<input name="password" type="password" required minlength="10" maxlength="256" autocomplete="new-password"></label><button class="primary">创建普通用户</button></form><div id="user-list"></div></section>
</main><script type="module" src="modules/app.mjs"></script></body></html>
